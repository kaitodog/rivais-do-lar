name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build e testes do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários (fórmula, modelos, capturas de tela)
        run: ./gradlew testDebugUnitTest
      - name: APK de debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-de-tela
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check enviar-push/index.ts limpar-fotos/index.ts _shared/google.ts
      - run: deno lint
      - run: deno test _shared/

  supabase:
    name: Banco (lint e testes SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sobe o Supabase local e aplica as migrações
        run: supabase db start
      # O db start aplica o seed.sql (casa de exemplo com as mesmas tarefas); os testes contam com o banco vazio.
      - name: Recria o banco sem os dados de exemplo
        run: supabase db reset --no-seed
      # Em produção o pg_net é ativado pelo painel; sem ele o lint acusa "schema net does not exist".
      - name: Ativa o pg_net, como no projeto de produção
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "create extension if not exists pg_net"
      - name: supabase db lint
        run: supabase db lint --level warning --fail-on error
      - name: Testes pgTAP (fórmula, fluxo, RLS)
        # Só a pasta de testes: supabase/tests/gerar_grade_pontos.sql é um gerador, não um teste.
        run: supabase test db supabase/tests/database
