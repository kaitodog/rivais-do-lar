name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build e testes do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários (fórmula, modelos, capturas de tela)
        run: ./gradlew testDebugUnitTest
      - name: APK de debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-de-tela
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  supabase:
    name: Banco (lint e testes SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sobe o Supabase local e aplica as migrações
        run: supabase db start
      - name: supabase db lint
        run: supabase db lint --level warning --fail-on error
      - name: Testes pgTAP (fórmula, fluxo, RLS)
        run: supabase test db
