name: Release do APK

# Cada tag v* (ex.: v0.1.0) gera o APK assinado e publica no GitHub Releases.
# O app instalado confere o último release ao abrir e oferece a atualização.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Restaura o keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure o secret KEYSTORE_BASE64 (veja o README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gera o APK release assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PversionName="$VERSAO" -PversionCode="${{ github.run_number }}"
          mv app/build/outputs/apk/release/app-release.apk "rivais-do-lar-$VERSAO.apk"

      - name: Changelog desde a última tag
        run: |
          ANTERIOR=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$ANTERIOR" ]; then INTERVALO="$ANTERIOR..$GITHUB_REF_NAME"; else INTERVALO="$GITHUB_REF_NAME"; fi
          git log --pretty='- %s' "$INTERVALO" > changelog.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Rivais do Lar ${{ github.ref_name }}
          body_path: changelog.md
          files: rivais-do-lar-*.apk
